services:
  backend:
    build: ./backend-node
    container_name: sysstatus-backend
    env_file:
      - ./backend-node/.env
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: sysstatus-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

